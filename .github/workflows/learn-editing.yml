name: Discover editing corpus

# Keeps a queue of niche videos worth measuring topped up around the clock.
#
# It only discovers — it does not download. That is not a design preference, it
# is a verified constraint: a probe run on a runner got "Sign in to confirm
# you're not a bot" from YouTube on 2 of 3 videos, because datacenter IPs are
# refused. Free Actions minutes cannot buy footage. What a runner *can* do is
# call the Data API, so it does that continuously and the Mac — on a
# residential connection, via launchd — drains the queue and measures.
#
# The measurements come back here (public repo, free storage, mirrored to the
# vault) so the corpus survives independently of any one machine.

on:
  schedule:
    # Offset from the 30-minute research scanner so the two never contend.
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Queue depth to maintain'
        required: false
        default: '60'

concurrency:
  group: discover-editing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet google-api-python-client

      - name: Top up the queue
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/discover_niche_videos.py \
            --limit "${{ github.event.inputs.limit || '60' }}"

      - name: Commit queue
        run: |
          if [ -z "$(git status --porcelain queue)" ]; then
            echo "Queue unchanged."
            exit 0
          fi
          depth=$(python -c "import json;print(len(json.load(open('queue/pending.json'))))")
          measured=$(find analysis/editing-grammar -name '*_grammar.json' 2>/dev/null | wc -l | tr -d ' ')
          git config user.name  "editing-learner"
          git config user.email "actions@github.com"
          git add queue
          git commit -m "queue: ${depth} videos pending (corpus: ${measured})"
          git pull --rebase --autostash
          git push
          echo "### Queue: ${depth} pending · corpus: ${measured} measured" >> $GITHUB_STEP_SUMMARY
