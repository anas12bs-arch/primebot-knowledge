name: probe — can a runner download from YouTube

# Throwaway diagnostic. YouTube blocks datacenter IPs aggressively, which would
# make the whole cloud learning engine useless. Answer that before relying on it.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet --upgrade yt-dlp
      - name: Try three known videos
        run: |
          for id in zQfOUUxJvJM 2JdufPA5EWU dQw4w9WgXcQ; do
            echo "=== $id ==="
            yt-dlp -f 'best[ext=mp4][height<=720]/best' \
                   -o "/tmp/$id.mp4" --no-playlist --socket-timeout 30 \
                   "https://www.youtube.com/watch?v=$id" 2>&1 | tail -5 || true
            if [ -f "/tmp/$id.mp4" ]; then
              echo "OK  $(du -h /tmp/$id.mp4 | cut -f1)"
              rm -f "/tmp/$id.mp4"
            else
              echo "BLOCKED"
            fi
          done
